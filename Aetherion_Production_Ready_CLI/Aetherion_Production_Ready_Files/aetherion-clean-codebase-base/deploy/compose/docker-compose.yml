services:
  postgres:
    image: postgres:16-alpine
    container_name: aetherion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aetherion
      POSTGRES_USER: aetherion_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable must be set}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherion_user -d aetherion"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aetherion_net

  redis:
    image: redis:7-alpine
    container_name: aetherion-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aetherion_net

  backend:
    image: aetherion-staging:uat-20261010
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: aetherion-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local-development}
      PORT: 5000
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY environment variable must be set}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable must be set}"
      DATABASE_URL: "postgresql://aetherion_user:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable must be set}@postgres:5432/aetherion"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      RUNNER_CONTAINER: 1
      REQUIRE_SANDBOX: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      SEED_ADMIN: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - workspace_data:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aetherion_net

  frontend-auth:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend-auth
    container_name: aetherion-frontend-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - aetherion_net

  worker-a:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: aetherion-worker-a
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      WORKER_ID: worker-a
      MAX_CONCURRENCY: 4
      CAPABILITIES: DEFAULT,CPU
      DATABASE_URL: "postgresql://aetherion_user:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable must be set}@postgres:5432/aetherion"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY environment variable must be set}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable must be set}"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - workspace_data:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - aetherion_net

  worker-b:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: aetherion-worker-b
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      WORKER_ID: worker-b
      MAX_CONCURRENCY: 4
      CAPABILITIES: DEFAULT,CPU
      DATABASE_URL: "postgresql://aetherion_user:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD environment variable must be set}@postgres:5432/aetherion"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY environment variable must be set}"
      JWT_SECRET: "${JWT_SECRET:?Error: JWT_SECRET environment variable must be set}"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    volumes:
      - workspace_data:/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - aetherion_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  workspace_data:
    driver: local

networks:
  aetherion_net:
    driver: bridge
