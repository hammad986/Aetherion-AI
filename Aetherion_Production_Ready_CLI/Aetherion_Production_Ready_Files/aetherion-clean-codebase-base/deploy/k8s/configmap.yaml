apiVersion: v1
kind: ConfigMap
metadata:
  name: aetherion-config
  namespace: aetherion
data:
  ENVIRONMENT: "production"
  PORT: "5000"
  REDIS_URL: "redis://redis.aetherion.svc.cluster.local:6379/0"
  ALLOWED_ORIGINS: "https://auth.aetherion.ai,https://cli.aetherion.ai"
  SERVER_URL: "https://api.aetherion.ai"
  FRONTEND_URL: "https://auth.aetherion.ai"
  RUNNER_CONTAINER: "1"
