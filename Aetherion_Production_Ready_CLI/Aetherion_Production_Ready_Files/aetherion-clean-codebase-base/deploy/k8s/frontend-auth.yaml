apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetherion-frontend-auth
  namespace: aetherion
  labels:
    app: aetherion-frontend-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aetherion-frontend-auth
  template:
    metadata:
      labels:
        app: aetherion-frontend-auth
    spec:
      containers:
        - name: frontend-auth
          image: aetherion/frontend-auth:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aetherion-frontend-auth
  namespace: aetherion
  labels:
    app: aetherion-frontend-auth
spec:
  type: ClusterIP
  selector:
    app: aetherion-frontend-auth
  ports:
    - port: 80
      targetPort: http
      name: http
