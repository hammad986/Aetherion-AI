apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetherion-ingress
  namespace: aetherion
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - hosts:
        - auth.aetherion.ai
        - api.aetherion.ai
      secretName: aetherion-tls-cert
  rules:
    - host: api.aetherion.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aetherion-backend
                port:
                  number: 5000
    - host: auth.aetherion.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aetherion-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aetherion-frontend-auth
                port:
                  number: 80
