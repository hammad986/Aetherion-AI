apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aetherion-postgres-data
  namespace: aetherion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aetherion
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: aetherion
            - name: POSTGRES_USER
              value: aetherion_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aetherion-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aetherion_user", "-d", "aetherion"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "aetherion_user", "-d", "aetherion"]
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: aetherion-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aetherion
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
