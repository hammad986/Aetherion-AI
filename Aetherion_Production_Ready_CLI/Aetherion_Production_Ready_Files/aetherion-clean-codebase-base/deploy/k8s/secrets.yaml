  name: aetherion-secrets
  namespace: aetherion
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_64_HEX_SECRET"
  JWT_SECRET: "REPLACE_WITH_DIFFERENT_64_HEX_SECRET"
